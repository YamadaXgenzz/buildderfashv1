name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      ORG_GRADLE_PROJECT_org.gradle.daemon: "true"
      ORG_GRADLE_PROJECT_org.gradle.parallel: "true"
      ORG_GRADLE_PROJECT_org.gradle.caching: "true"

    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          file project.zip

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          unzip -t project.zip > /dev/null

          echo "✅ ZIP valid"
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo "=== Mengunci Project Dir (Manut Mode) ==="

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================
      # JAVA + GRADLE CACHE
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ==========================================================
      # FIX FLUTTER SDK PATH
      # ==========================================================
      - name: Normalize Flutter SDK path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Normalizing Flutter SDK path ==="
          echo "Runner OS: $RUNNER_OS"
          echo "Flutter SDK: $FLUTTER_ROOT"

          LOCAL_PROPS="android/local.properties"

          if [ -f "$LOCAL_PROPS" ]; then
            grep -vE '^[[:space:]]*flutter\.sdk[[:space:]]*=' "$LOCAL_PROPS" > "$LOCAL_PROPS.tmp" || true
            mv "$LOCAL_PROPS.tmp" "$LOCAL_PROPS"
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" >> "$LOCAL_PROPS"
          else
            mkdir -p android
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > "$LOCAL_PROPS"
          fi

          echo "✅ Flutter SDK path normalized."

      # ==========================================================
      # PUB GET
      # Dijalankan sekali saja sebelum analyze/build.
      # Build/analyze menggunakan --no-pub agar dependency tidak
      # diperiksa/download ulang.
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== Running flutter pub get ==="
            timeout 180s flutter pub get
          else
            echo "☕ Native Android project, skip pub get."
          fi

      # ==========================================================
      # ANALYZE HANYA JIKA DIMINTA
      # Build normal tidak lagi membuang waktu untuk flutter analyze.
      # ==========================================================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            flutter analyze --no-pub 2>&1 | tee analyze_report.txt
          else
            echo "❌ Fitur analyze hanya support project Flutter."
            exit 1
          fi

      # ==========================================================
      # STOP JIKA ANALYZE ONLY
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode selesai."
          exit 0

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Flutter project detected."

            # --no-pub: dependency sudah diambil di step sebelumnya.
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub

          else
            echo "☕ Native Android project detected."

            GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)

            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              exit 1
            fi

            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug --build-cache --parallel
            else
              ./gradlew assembleRelease --build-cache --parallel
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          echo "=== APK Output Scanning ==="

          APK_FOUND=$(find "$GITHUB_WORKSPACE" -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")

          echo "✅ APK ditemukan: $APK_PATH"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
